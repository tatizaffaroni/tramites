<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Caratula de Tramit.Es</title>
    <link rel="stylesheet" type="text/css" href="caratula.css">
    <script src="caratula.js"></script>
</head>

<body>
    <section class="marco">
      <div>
        <img src="marco.svg" alt="Marco de Tramit.Es">
      </div>
    </section>
    
    <section class="contenido">
        <div class="logo">
           <img src="Logo.svg" alt="Logo de Tramit.Es">

           <div class="registro">Registro Notarial <strong>N° 624</strong></div>

        </div>

        
        
        <section class="datos">
            <div class="separador">
                <img src="separador.svg" alt="Separador de Tramit.Es">
            </div>
            <div class="etiqueta">Instrumento:</div>
            <div id="instrumento" class="campo"></div>

            <table>
                <tr>
                    <td class="etiqueta1">Otorga:</td>
                    <td class="etiqueta2">A favor de:</td>
                </tr>
                <tr>
                    <td id="otorga" class="campo1"></td>
                    <td id="afavorde" class="campo2"></td>
                </tr>
            </table>
            <div class="separador">
                <img src="separador.svg" alt="Separador de Tramit.Es">
            </div>
        </section>
        

        <section class="contacto">
            <div>Junín N° 1154, Piso 10, Oficina 1. Corrientes Capital</div>
            <div>andrearominazaffaroni@gmail.com</div>
            <div>379 422-2863</div>
        </section>
        
        <div id="fecha" class="fecha"></div>
    </section>
</body>
